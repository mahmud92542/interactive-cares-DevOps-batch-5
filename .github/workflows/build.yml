name: Secrets & Variables Parallel Demo
on:
  workflow_dispatch:

jobs:
  # Job 1: Show Repo Variable
  show-variable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Repo Variable
        run: echo "Repository variable ENVIRONMENT is ${{ vars.ENVIRONMENT }}"

  # Job 2: Show Secret
  show-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Secret (masked)
        run: echo "Repository secret ASSISTANT_ID is ${{ secrets.ASSISTANT_ID }}"

  # Job 3: Dependent job (runs after first two finish)
  combined-info:
    runs-on: ubuntu-latest
    needs: [show-variable, show-secret]   # depends on the first two jobs
    steps:
      - uses: actions/checkout@v4
      - name: Combined Info
        run: |
          echo "This job runs after the first two jobs."
          echo "ENVIRONMENT variable: ${{ vars.ENVIRONMENT }}"
          echo "Secret is masked: ${{ secrets.ASSISTANT_ID }}"
