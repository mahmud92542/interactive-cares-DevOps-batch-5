name: Conditional Demo
on:
  workflow_dispatch:

jobs:
  demo-conditional:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Step 1 always runs"

      # Step 2 runs only if ENVIRONMENT variable is DEV
      - name: Run Only in DEV
        if: ${{ vars.ENVIRONMENT == 'DEV' }}
        run: echo "This step runs only in DEV environment"

      # Step 3 runs if ENVIRONMENT is not DEV
      - name: Run Only if NOT DEV
        if: ${{ vars.ENVIRONMENT != 'DEV' }}
        run: echo "This step runs only in other environments"
