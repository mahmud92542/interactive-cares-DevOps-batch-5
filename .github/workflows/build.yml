name: Secrets & Variables Demo
on:
  workflow_dispatch:   # run manually

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo (optional, good practice)
      - uses: actions/checkout@v4

      # Step 2: Show repository variable (visible)
      - name: Show Repo Variable
        run: echo "Repository variable ENVIRONMENT is ${{ vars.ENVIRONMENT }}"

      # Step 3: Show secret (will be masked)
      - name: Show Secret (masked)
        run: echo "Repository secret ASSISTANT_ID is ${{ secrets.ASSISTANT_ID }}"
