name: Runner Details Demo

on:
  workflow_dispatch:

jobs:
  show-info:
    runs-on: ubuntu-latest

    steps:
      - name: Show OS info
        run: uname -a

      - name: Show CPU info
        run: lscpu

      - name: Show Memory info
        run: free -h

      - name: Show Disk info
        run: df -h

      - name: List files in workspace
        run: ls -la

      - name: Show environment variables
        run: printenv

      - name: Show GitHub runner details
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner architecture: ${{ runner.arch }}"
