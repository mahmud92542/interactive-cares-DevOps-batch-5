name: Artiface Demo
on: 
  oush:
    branches:
      - main

jobs:
  upload-demo-file:
    runs-on: ubuntu-latest

    steps:
      - name: Create file 
        run: echo "Hello from GitHub Actions artifact demo!" > hello.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: hello.txt