name: Secrets & Variables Parallel Demo
on:
  workflow_dispatch:

jobs:
  # Job 1: Show Repo Variable
  show-variable:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - uses: actions/checkout@v4
      - name: Show Repo Variable
        run: |
          echo "Repository variable ENVIRONMENT is ${{ vars.DEV_VARIABLE }}"
          echo "Repository secret ASSISTANT_ID is ${{ secrets.DEV_KEY }}"

  # Job 2: Show Secret
  show-secret:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4
      - name: Show Secret (masked)
        run: |
          echo "Repository variable ENVIRONMENT is ${{ vars.PROD_VARIABLE }}"
          echo "Repository secret ASSISTANT_ID is ${{ secrets.PROD_KEY }}"

