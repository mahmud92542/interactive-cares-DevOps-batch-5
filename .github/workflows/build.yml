name: Parallel & Dependent Demo
on:
  push: 
    branches:
      - main
    paths: 
      - 'src/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is the build step."
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is the lint step, dependent on build."
  test:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - run: echo "This is the test step, dependent on build and lint."